<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f6fb;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h2 {
            margin: 0;
        }

        .logout {
            background: white;
            color: #764ba2;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout:hover {
            background: #eee;
        }

        /* MAIN */
        .container {
            padding: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .create-btn {
            background: linear-gradient(135deg, #4facfe, #00c6ff);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .quiz-id {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .actions a {
            display: inline-block;
            margin-right: 8px;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .take {
            background: #e0f7fa;
            color: #00796b;
        }

        .edit {
            background: #fff3e0;
            color: #ef6c00;
        }

        .results {
            background: #ede7f6;
            color: #5e35b1;
        }

        .actions a:hover {
            opacity: 0.8;
        }

        .empty {
            text-align: center;
            margin-top: 80px;
            color: #777;
        }

        .copy {
            background: #e3f2fd;
            color: #1565c0;
        }

        .delete {
            background: #ffebee;
            color: #c62828;
            border: none;
            cursor: pointer;
        }

        .icon-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.action-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(10px);

    cursor: pointer;
    text-decoration: none;

    transition: all 0.2s ease;
}

.action-icon:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.action-icon:active {
    transform: scale(0.95);
}

/* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 768px) {

    body {
        overflow-x: hidden;
    }

    .header {
        padding: 18px 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .header-left {
        width: 100%;
        justify-content: flex-start;
    }

    .header h2 {
        font-size: 24px;
    }

    .logout {
        align-self: flex-end;
    }

    .container {
        padding: 20px;
    }

    .top-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
    }

    .top-bar h3 {
        margin: 0;
    }

    .create-btn {
        text-align: center;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
    }

    .actions a {
        margin: 0;
        flex: 1 1 calc(50% - 10px);
        text-align: center;
        padding: 10px;
        box-sizing: border-box;
    }

    .actions .delete {
        flex: 1 1 calc(50% - 10px);
        text-align: center;
        padding: 10px;
        box-sizing: border-box;
    }

    .quiz-id {
        word-break: break-word;
        line-height: 1.5;
    }

    .icon-actions {
        gap: 8px;
    }

    .action-icon {
        width: 38px;
        height: 38px;
    }

    .empty {
        margin-top: 50px;
        padding: 0 10px;
    }
}
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="icon-actions">
    <!-- Back -->
    <button type="button" class="action-icon" onclick="history.back()" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Home -->
    <a href="/" class="action-icon" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 10L12 3L21 10V20H3V10Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
    </a>
</div>
        <h2>📊 Your Dashboard</h2>
    </div>
    <a href="/logout" class="logout">Logout</a>
</div>

<!-- MAIN -->
<div class="container">

    <div class="top-bar">
        <h3>Your Quizzes</h3>
        <a href="/create_quiz" class="create-btn">+ Create Quiz</a>
    </div>

    {% if quizzes %}
        <div class="grid">
            {% for quiz_id in quizzes %}
                <div class="card">

                    <div class="quiz-id">
                        Quiz ID: <b>{{ quiz_id }}</b>
                    </div>

                    <div class="actions">
                        <a href="/quiz/{{ quiz_id }}" class="take">Take</a>
                        <a href="/edit_quiz/{{ quiz_id }}" class="edit">Edit</a>
                        <a href="/results/{{ quiz_id }}" class="results">Results</a>
                        <a href="#" class="copy" onclick="copyLink('{{ quiz_id }}', this)">Copy Link</a>
                        <form method="POST" action="/delete_quiz/{{ quiz_id }}" style="display: inline;">
                            <button type="submit" class="delete" onclick="return confirm('Are you sure you want to delete this quiz?')">Delete</button>
                        </form>
                    </div>

                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            <h3>No quizzes yet 😢</h3>
            <p>Create your first quiz to get started!</p>
        </div>
    {% endif %}

</div>

<script>
function copyLink(quizId, btn) {
    const link = window.location.origin + "/quiz/" + quizId;

    navigator.clipboard.writeText(link).then(() => {
        const originalText = btn.innerText;
        btn.innerText = "Copied!";
        btn.style.background = "#c8e6c9";
        btn.style.color = "#2e7d32";

        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "#e3f2fd";
            btn.style.color = "#1565c0";
        }, 1500);
    });
}
</script>

</body>
</html>

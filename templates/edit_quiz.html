<!DOCTYPE html>
<html>
<head>
    <title>Edit Quiz</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            width: 420px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .warning {
            font-size: 13px;
            color: #d84315;
            margin-bottom: 15px;
        }

        .file-input {
            margin: 15px 0;
            text-align: left;
        }

        .file-input label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input[type="file"]:hover {
            border-color: #ff6f61;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6f61, #ff9472);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            font-size: 13px;
            color: #555;
        }

        .back:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="card">

    <h2>✏️ Edit Quiz</h2>

    <div class="warning">
        ⚠ Uploading new files will overwrite the existing quiz
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="file-input">
            <label>Replace Questions</label>
            <input type="file" name="questions_file">
            <div class="hint">Upload a new MCQ file (.txt)</div>
        </div>

        <div class="file-input">
            <label>Replace Answers</label>
            <input type="file" name="answers_file">
            <div class="hint">Optional — only if answer key changes</div>
        </div>

        <button type="submit">💾 Update Quiz</button>

    </form>

    <a href="/dashboard" class="back">← Back to Dashboard</a>

</div>

</body>
</html>

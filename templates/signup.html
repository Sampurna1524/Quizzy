<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Quizzy</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            overflow: hidden;
        }

        /* LEFT SIDE */
        .left {
            flex: 1;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
        }

        .logo {
            font-size: 85px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .features {
            margin-top: 20px;
        }

        .feature {
            margin: 10px 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Floating quiz bubbles */
        .dot {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
        }

        .dot1 { width: 90px; height: 90px; background: white; top: 15%; left: 25%; }
        .dot2 { width: 60px; height: 60px; background: white; bottom: 20%; left: 40%; }
        .dot3 { width: 120px; height: 120px; background: white; top: 50%; left: 75%; }

        /* RIGHT SIDE */
        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 18px;
            width: 360px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease;
            overflow: hidden;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Progress bar */
        .progress {
            height: 6px;
            background: rgba(255,255,255,0.45);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(67,206,162,0.12);
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            color: #555;
        }

        input {
    width: 100%;
    padding: 8px 12px;   /* reduced from 12px / 14px */
    height: 38px;        /* smaller textbox height */
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ccc;
    transition: 0.3s;
    box-sizing: border-box;
}

        input:focus {
            border-color: #43cea2;
            outline: none;
            box-shadow: 0 0 6px rgba(67,206,162,0.6);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .login {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login a {
            color: #43cea2;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-actions {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
}

.action-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(10px);

    cursor: pointer;
    text-decoration: none;

    transition: all 0.2s ease;
}

.action-icon:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.action-icon:active {
    transform: scale(0.95);
}

/* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 768px) {

    body {
        flex-direction: column;
        min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    }

    /* HOME BUTTON */
    .top-actions {
        top: 15px;
        left: 15px;
    }

    .action-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
    }

    /* LEFT SIDE */
    .left {
        flex: unset;
        padding: 90px 25px 40px;
        text-align: center;
        align-items: center;
    }

    .logo {
        font-size: 58px;
        line-height: 1.1;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
    }

    .tagline {
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 30px;
        position: relative;
        z-index: 2;
    }

    .features {
        width: 100%;
        position: relative;
        z-index: 2;
    }

    .feature {
        font-size: 15px;
        margin: 14px 0;
    }

    /* FLOATING DOTS */
    .dot {
        opacity: 0.15;
        z-index: 0;
    }

    .dot1 {
        width: 90px;
        height: 90px;
        top: 12%;
        left: -20px;
    }

    .dot2 {
        width: 70px;
        height: 70px;
        bottom: 10%;
        left: 15%;
    }

    .dot3 {
        width: 120px;
        height: 120px;
        top: 58%;
        right: -40px;
        left: auto;
    }

    /* RIGHT SIDE */
    .right {
        flex: unset;
        width: 100%;
        padding: 0 20px 40px;
        box-sizing: border-box;
    }

    .card {
        width: 100%;
        max-width: 100%;
        padding: 28px 22px;
        border-radius: 24px;
        box-sizing: border-box;
    }

    .card h2 {
        font-size: 32px;
        line-height: 1.3;
        margin-bottom: 22px;
    }

    /* INPUTS */
    input {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 14px;
    }

    /* BUTTON */
    button {
        width: 100%;
        padding: 15px;
        font-size: 17px;
        border-radius: 14px;
    }

    /* LOGIN TEXT */
    .login {
        font-size: 16px;
        line-height: 1.5;
    }
}
    </style>
</head>

<body>

    <div class="top-actions">
    <a href="/" class="action-icon" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 10L12 3L21 10V20H3V10Z"
                  stroke="white" stroke-width="2"
                  stroke-linejoin="round"/>
        </svg>
    </a>
</div>

<!-- LEFT -->
<div class="left">
    <div class="logo">Quizzy</div>
    <div class="tagline">
        Start your quiz journey today.
    </div>

    <div class="features">
        <div class="feature">✔ Create quizzes effortlessly</div>
        <div class="feature">✔ Instant result evaluation</div>
        <div class="feature">✔ Track performance & rankings</div>
        <div class="feature">✔ Export detailed reports</div>
    </div>

    <!-- floating elements -->
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
</div>

<!-- RIGHT -->
<div class="right">
    <div class="card">

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <h2>📝 Create Your Quiz Account</h2>

        <form method="POST">

            <div class="input-group">
                <label>Username</label>
                <input name="username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input name="password" type="password" required>
            </div>

            <button type="submit">🚀 Begin Your Journey</button>

        </form>

        <div class="login">
            Already have an account? <a href="/login">Login</a>
        </div>

    </div>
</div>

</body>
</html>

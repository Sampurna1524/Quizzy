<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f5f7fb;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
             padding-left: 150px;
        }

        /* CONTAINER */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        /* NAME INPUT */
        .name-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .name-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* fallback safety */
        }

        /* QUESTION CARD */
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .question {
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* OPTIONS */
        .option {
            display: block;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f0f3ff;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + span {
            background: #667eea;
            color: white;
            border-radius: 8px;
            padding: 10px;
            display: block;
        }

        /* SUBMIT BUTTON */
        .submit-box {
            text-align: center;
            margin-top: 30px;
        }

        .submit-box button {
    padding: 14px 30px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .top-actions {
    position: fixed;
    top: 15px;
    left: 20px;
    z-index: 1000;
    display: flex;
    gap: 10px;
}

.action-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    padding: 0; 
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(10px);

    cursor: pointer;
    text-decoration: none;

    transition: all 0.2s ease;
}

.action-icon:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.action-icon:active {
    transform: scale(0.95);
}

/* hide animation */
.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

.action-icon svg {
    display: block;
}

/* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 768px) {

    body {
        overflow-x: hidden;
    }

    /* HEADER */
    .header {
        padding: 18px 20px;
        padding-left: 85px;
        font-size: 18px;
    }

    /* TOP ACTION BUTTONS */
    .top-actions {
        top: 12px;
        left: 12px;
        gap: 8px;
    }

    .action-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
    }

    /* MAIN CONTAINER */
    .container {
        margin: 20px auto;
        padding: 15px;
    }

    /* NAME BOX */
    .name-box {
        padding: 18px;
        border-radius: 14px;
    }

    .name-box input {
        width: 100%;
        font-size: 16px;
    }

    /* QUESTION CARDS */
    .card {
        padding: 18px;
        border-radius: 16px;
    }

    .question {
        font-size: 17px;
        line-height: 1.5;
    }

    /* OPTIONS */
    .option {
        padding: 12px;
        font-size: 15px;
        line-height: 1.5;
    }

    input[type="radio"]:checked + span {
        padding: 12px;
    }

    /* SUBMIT BUTTON */
    .submit-box {
        margin-top: 25px;
    }

    .submit-box button {
        width: 100%;
        padding: 15px;
        font-size: 17px;
        border-radius: 14px;
    }
}
    </style>
</head>

<body>

<div class="top-actions">
    <a href="/" class="action-icon" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 10L12 3L21 10V20H3V10Z"
                  stroke="#2d2d2d" stroke-width="2"
                  stroke-linejoin="round"/>
        </svg>
    </a>

    <button type="button" class="action-icon" id="topSubmitBtn"
        onclick="document.querySelector('form').submit()" title="Submit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17L4 12"
                  stroke="#2d2d2d" stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
    </button>
</div>

<div class="header">
    🧠 Test yourself
</div>

<div class="container">

<form method="POST" action="/submit/{{ quiz_id }}">

    <!-- NAME -->
    <div class="name-box">
        <label><b>Your Name</b></label><br><br>
        <input type="text" name="name" required>
    </div>

    <!-- QUESTIONS -->
    {% for q in questions %}
        {% set q_index = loop.index %}

        <div class="card">

            <div class="question">
                {{ q_index }}. {{ q.question }}
            </div>

            {% for key, val in q.options.items() %}
                <label class="option">
                    <input type="radio" name="q{{ q_index }}" value="{{ key }}">
                    <span>{{ key }}) {{ val }}</span>
                </label>
            {% endfor %}

        </div>
    {% endfor %}

    <!-- SUBMIT -->
    <div class="submit-box">
        <button type="submit">🚀 Submit Quiz</button>
    </div>

</form>

</div>

<script>
window.addEventListener("scroll", function () {
    const btn = document.getElementById("topSubmitBtn");

    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight;
    const windowHeight = window.innerHeight;

    // if user is near bottom → hide top submit
    if (scrollTop + windowHeight >= docHeight - 200) {
        btn.classList.add("hide");
    } else {
        btn.classList.remove("hide");
    }
});
</script>

</body>
</html>

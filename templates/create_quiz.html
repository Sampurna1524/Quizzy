<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* FLOATING BACKGROUND CIRCLES */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            animation: float 10s infinite ease-in-out;
        }

        .c1 { width: 120px; height: 120px; top: 10%; left: 10%; }
        .c2 { width: 80px; height: 80px; bottom: 15%; right: 10%; }
        .c3 { width: 150px; height: 150px; top: 60%; left: 70%; }

        /* MAIN CARD */
        .top-actions {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            padding: 4px;
        }

        .action-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.22);
            color: #333;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(10px);
            line-height: 1;
            box-sizing: border-box;
            vertical-align: middle;
            font-size: 20px;
        }

        button.action-icon {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 0;
            margin: 0;
        }

        .action-icon:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.4);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .action-icon:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
        }

        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 35px 40px;
            border-radius: 18px;
            width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: fadeIn 0.6s ease;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        /* FILE INPUT */
        .file-box {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            transition: 0.3s;
            text-align: left;
        }

        .file-box:hover {
            border-color: #667eea;
            background: rgba(102,126,234,0.05);
        }

        .file-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="file"] {
            width: 100%;
            border: none;
            background: transparent;
        }

        textarea {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            background: transparent;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102,126,234,0.2);
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* BUTTON */
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 768px) {

    body {
        padding: 20px;
        min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
        align-items: center;
    }

    .card {
        width: 100%;
        max-width: 100%;
        padding: 25px 20px;
        border-radius: 16px;
    }

    h2 {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
        line-height: 1.5;
    }

    .file-box {
        padding: 14px;
    }

    input[type="file"] {
        font-size: 14px;
    }

    button {
        width: 100%;
        font-size: 15px;
        padding: 13px;
    }

    .top-actions {
        top: 15px;
        left: 15px;
    }

    .action-icon {
        width: 38px;
        height: 38px;
    }

    .circle {
        opacity: 0.15;
    }

    .c3 {
        display: none;
    }
}
    </style>
</head>

<body>

<!-- Background circles -->
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="top-actions">
    <!-- Back Button -->
    <button type="button" class="action-icon" onclick="history.back();" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Home Button -->
    <a href="/" class="action-icon" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 10L12 3L21 10V20H3V10Z" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
        </svg>
    </a>
</div>

<!-- Card -->
<div class="card">

    <h2>📝 Create New Quiz</h2>
    <div class="subtitle">Upload your questions and answer key to generate a quiz instantly</div>

    <form method="POST" enctype="multipart/form-data">

        <div class="file-box">
            <label>🏷️ Quiz Name</label>
            <input type="text" name="quiz_name" placeholder="Enter a quiz title" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;" required>
            <div class="hint">Give your quiz a descriptive title so it is easier to find.</div>
        </div>

        <div class="file-box">
            <label>📄 Questions File</label>
            <input type="file" name="questions_file" accept=".txt,.pdf,.docx,.doc" required>
            <div class="hint">Supports .txt, .pdf, or .docx formats (MCQs)</div>
        </div>

        <div class="file-box">
            <label>✅ Answer Key (Optional)</label>
            <input type="file" name="answers_file" accept=".txt,.pdf,.docx,.doc">
            <div class="hint">Supports .txt, .pdf, or .docx formats</div>
        </div>

        <div class="file-box">
            <label>📝 Message from Teacher (Optional)</label>
            <textarea name="teacher_message" rows="4" placeholder="Enter a message for your students..."></textarea>
            <div class="hint">This message will be displayed to students taking the quiz</div>
        </div>

        <button type="submit">🚀 Generate Quiz</button>

    </form>

</div>

</body>
</html>

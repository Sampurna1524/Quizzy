<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f6fb;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .download-btn {
            background: white;
            color: #764ba2;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #eee;
        }

        /* CONTAINER */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        /* TABLE CARD */
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #f1f3ff;
            color: #555;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9ff;
        }

        /* RANK COLORS */
        .top1 {
            background: #fff8e1;
            font-weight: bold;
        }

        .top2 {
            background: #f3f3f3;
        }

        .top3 {
            background: #fbe9e7;
        }

        /* SCORE BADGE */
        .score {
            padding: 5px 10px;
            border-radius: 8px;
            background: #e0f7fa;
            color: #00796b;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 50px;
        }

        .header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.icon-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.action-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(10px);

    cursor: pointer;
    text-decoration: none;

    transition: all 0.2s ease;
}

.action-icon:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.action-icon:active {
    transform: scale(0.95);
}

/* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 768px) {

    body {
        min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    }

    /* HEADER */
    .header {
        padding: 18px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .header-left {
        width: 100%;
        align-items: flex-start;
        gap: 12px;
    }

    .header h2 {
        font-size: 18px;
        line-height: 1.4;
        margin: 0;
        word-break: break-word;
    }

    /* ACTION ICONS */
    .icon-actions {
        gap: 8px;
    }

    .action-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
    }

    /* DOWNLOAD BUTTON */
    .download-btn {
        width: 100%;
        text-align: center;
        box-sizing: border-box;
        padding: 12px;
        font-size: 15px;
    }

    /* CONTAINER */
    .container {
        margin: 20px auto;
        padding: 15px;
    }

    /* CARD */
    .card {
        padding: 16px;
        border-radius: 16px;
        overflow-x: auto;
    }

    /* TABLE */
    table {
        min-width: 650px;
    }

    th,
    td {
        padding: 10px;
        font-size: 14px;
        white-space: nowrap;
    }

    /* SCORE BADGE */
    .score {
        display: inline-block;
        padding: 5px 10px;
        font-size: 13px;
    }

    /* EMPTY STATE */
    .empty {
        padding: 20px;
        margin-top: 40px;
    }

    .empty h3 {
        font-size: 22px;
    }

    .empty p {
        font-size: 15px;
        line-height: 1.5;
    }
}
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="header-left">
        <div class="icon-actions">

            <!-- Back -->
            <button type="button" class="action-icon" onclick="history.back()" title="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Home -->
            <a href="/" class="action-icon" title="Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M3 10L12 3L21 10V20H3V10Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </a>

        </div>

        <h2>📊 Results for Quiz {{ quiz_id }}</h2>
    </div>

    <a href="/download_report/{{ quiz_id }}" class="download-btn">
        ⬇ Download CSV
    </a>

</div>

<!-- MAIN -->
<div class="container">

    {% if results %}
        <div class="card">

            <table>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Score</th>
                    <th>Total</th>
                    <th>Time</th>
                </tr>

                {% for r in results %}
                <tr class="
                    {% if loop.index == 1 %}top1
                    {% elif loop.index == 2 %}top2
                    {% elif loop.index == 3 %}top3
                    {% endif %}
                ">
                    <td>{{ loop.index }}</td>
                    <td>{{ r[0] }}</td>
                    <td><span class="score">{{ r[1] }}</span></td>
                    <td>{{ r[2] }}</td>
                    <td>{{ r[3] }}</td>
                </tr>
                {% endfor %}
            </table>

        </div>
    {% else %}
        <div class="empty">
            <h3>No attempts yet 📭</h3>
            <p>Students haven't submitted this quiz yet.</p>
        </div>
    {% endif %}

</div>

</body>
</html>

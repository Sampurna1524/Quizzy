<!DOCTYPE html>
<html>
<head>
    <title>Admin Upload</title>

<body>

<h2>Upload Quiz</h2>

<form method="POST" enctype="multipart/form-data">

    <button type="submit">Upload</button>

</form>

</body>
</html>
